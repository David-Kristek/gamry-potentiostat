<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="potentiostat architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <rect width="920" height="360" fill="#fcfcfb"/>

  <!-- Host panel -->
  <rect x="20" y="20" width="380" height="250" rx="14" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="210" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">Host&#160;&#160;&#183;&#160;&#160;any interpreter</text>

  <rect x="60" y="90" width="300" height="56" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="210" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#0b0b0b">run_sequence(cfg)</text>
  <text x="210" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#898781">spawns the worker, returns a Future</text>

  <rect x="60" y="180" width="300" height="56" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="210" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#0b0b0b">SequenceResults + events</text>
  <text x="210" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#898781">CSV/DTA paths per technique</text>

  <!-- Worker panel -->
  <rect x="520" y="20" width="380" height="250" rx="14" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="710" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">Gamry Python 3.7&#160;&#160;&#183;&#160;&#160;32-bit</text>

  <rect x="560" y="90" width="300" height="56" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
  <text x="710" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#0b0b0b">execute_sequence_sync(cfg)</text>
  <text x="710" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#898781">OCP &#8594; EIS &#8594; LPR &#8594; CPP</text>

  <rect x="560" y="180" width="300" height="56" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="710" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#0b0b0b">core.techniques / ToolkitPy</text>
  <text x="710" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#898781">hardware I/O, .DTA/.CSV writers</text>

  <!-- Arrows -->
  <line x1="362" y1="118" x2="556" y2="118" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="459" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#2a78d6">TASK</text>

  <line x1="558" y1="208" x2="364" y2="208" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="459" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#2a78d6">EVENT &#183; RESULT</text>
  <text x="459" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#898781">ERROR &#183; ABORTED</text>

  <!-- Footer -->
  <text x="460" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0b0b0b">pyproc-bridge &#183; JSON over TCP</text>
  <text x="460" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#898781">GAMRY_PYTHON / TOOLKITPY_HOME / GAMRY_SOURCE_ROOT resolved by env_validation.py</text>
</svg>
